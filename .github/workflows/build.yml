name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Get the project
        uses: actions/checkout@v7

      - name: Download the game font (Grenze)
        run: |
          mkdir -p app/src/main/assets/fonts
          for w in 400 500 600 700; do
            curl -fsSL "https://cdn.jsdelivr.net/fontsource/fonts/grenze@latest/latin-${w}-normal.woff2" \
              -o "app/src/main/assets/fonts/grenze-${w}.woff2" || echo "Font ${w} not downloaded, the game will use a fallback font"
          done
          ls -l app/src/main/assets/fonts

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.9

      - name: Build the APK
        run: gradle --no-daemon assembleDebug

      - name: Rename the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ForgeMemory.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: ForgeMemory-apk
          path: ForgeMemory.apk
